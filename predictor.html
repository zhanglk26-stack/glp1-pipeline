<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能匹配器 | GLP-1 Pipeline Tracker</title>
  <meta name="description" content="基于全球最新临床试验数据，输入BMI与健康状况，智能匹配最适合的GLP-1减重方案。">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen" data-page="predictor" data-footer="simple">
  <div id="siteHeader"></div>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Hero -->
    <div class="bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 rounded-3xl p-8 md:p-12 mb-8 text-white relative overflow-hidden shadow-xl shadow-blue-500/10">
      <div class="relative z-10 max-w-2xl">
        <h1 class="text-3xl md:text-4xl font-bold mb-4">GLP-1 减肥方案智能匹配</h1>
        <p class="text-blue-100 text-lg mb-6">基于全球最新临床试验终点数据，为您提供个性化的减重药物方案分析。</p>
        <div class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-4 py-2 rounded-full text-xs font-semibold">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
          本工具仅供参考，不作为医疗诊断及用药建议
        </div>
      </div>
      <div class="absolute top-0 right-0 -translate-y-1/2 translate-x-1/4 w-96 h-96 bg-blue-400/20 rounded-full blur-3xl"></div>
      <div class="absolute bottom-0 left-1/2 translate-y-1/2 w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl"></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Input Panel -->
      <div class="lg:col-span-1">
        <section class="card p-6 sticky top-24">
          <h2 class="text-lg font-bold mb-6 flex items-center gap-2 text-slate-900">
            <div class="w-1 h-5 bg-blue-600 rounded-full"></div> 基本信息
          </h2>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">当前体重 (kg)</label>
              <input type="number" id="weight" class="input-field" placeholder="例如: 100">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">身高 (cm)</label>
              <input type="number" id="height" class="input-field" placeholder="例如: 175">
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">年龄</label>
                <input type="number" id="age" class="input-field">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">性别</label>
                <select id="gender" class="input-field"><option value="male">男</option><option value="female">女</option></select>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">预期疗程</label>
              <select id="duration" class="input-field">
                <option value="12">12周 (3个月)</option>
                <option value="24">24周 (6个月)</option>
                <option value="48" selected>48周 (12个月)</option>
                <option value="52">52周 (1年)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">健康状况 (多选)</label>
              <div class="flex flex-wrap gap-2">
                <label class="cursor-pointer"><input type="checkbox" name="condition" value="diabetes" class="peer hidden"><span class="filter-tag">2型糖尿病</span></label>
                <label class="cursor-pointer"><input type="checkbox" name="condition" value="nash" class="peer hidden"><span class="filter-tag">脂肪肝/MASH</span></label>
                <label class="cursor-pointer"><input type="checkbox" name="condition" value="cvd" class="peer hidden"><span class="filter-tag">心血管疾病</span></label>
              </div>
            </div>
            <button id="matchButton" onclick="calculateMatch()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-500/20 active:scale-[0.98] mt-4">
              开始智能匹配
            </button>
            <p id="predictorStatus" class="mt-3 text-xs text-slate-500">正在加载候选药物数据...</p>
          </div>
        </section>
      </div>

      <!-- Results -->
      <div id="results" class="lg:col-span-2 hidden space-y-8">
        <section class="card p-6">
          <h2 class="text-lg font-bold mb-6 text-slate-900">身体指标分析</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="text-center p-4 bg-slate-50 rounded-2xl"><div class="text-4xl font-bold text-blue-600 mb-1" id="bmiValue">--</div><div class="text-xs font-bold text-slate-400 uppercase">BMI 指数</div><div id="bmiCategory" class="mt-2"></div></div>
            <div class="text-center p-4 bg-slate-50 rounded-2xl"><div class="text-4xl font-bold text-slate-900 mb-1" id="targetWeight">--</div><div class="text-xs font-bold text-slate-400 uppercase">建议减重目标</div><div class="text-[10px] text-slate-400 mt-2 font-medium">临床建议减重 10-15%</div></div>
            <div class="text-center p-4 bg-slate-50 rounded-2xl"><div class="text-4xl font-bold text-slate-900 mb-1" id="waistStatus">--</div><div class="text-xs font-bold text-slate-400 uppercase">代谢风险评估</div></div>
          </div>
        </section>

        <div>
          <h2 class="text-xl font-bold mb-6 text-slate-900 flex items-center gap-2"><div class="w-1.5 h-6 bg-blue-600 rounded-full"></div> 推荐治疗方案</h2>
          <div id="recommendations" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <section class="card p-6">
          <h2 class="text-lg font-bold mb-6 text-slate-900">预期减重轨迹 (48周)</h2>
          <div class="h-80"><canvas id="weightLossChart"></canvas></div>
        </section>

        <section class="card">
          <div class="p-6 border-b border-slate-100"><h2 class="text-lg font-bold text-slate-900">费用预估与可及性分析</h2></div>
          <div class="table-container overflow-visible">
            <table class="w-full border-separate border-spacing-0 table-fixed text-left data-table">
              <thead class="bg-white z-20">
                <tr>
                  <th class="th-sticky">方案</th>
                  <th class="th-sticky">月费用</th>
                  <th class="th-sticky">总费用</th>
                  <th class="th-sticky">医保参考</th>
                  <th class="th-sticky">仿制药预期</th>
                </tr>
              </thead>
              <tbody id="costTable" class="text-sm"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div id="siteFooter"></div>
  <script type="module" src="/src/pages/predictor.js"></script>
</body>
</html>

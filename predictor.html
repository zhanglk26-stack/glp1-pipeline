<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLP-1 减肥方案智能匹配器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gradient-text {
            background: linear-gradient(135deg, #00d4ff 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-glow:focus {
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.15);
        }
        .recommendation-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        .best-match {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(251, 191, 36, 0.2) 100%);
            border: 2px solid #f59e0b;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body class="bg-dark-900 text-white min-h-screen">
    <!-- Header -->
    <nav class="bg-dark-800 border-b border-dark-500 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-neon-blue to-neon-purple flex items-center justify-center text-xl">
                    🧮
                </div>
                <div>
                    <h1 class="text-xl font-bold">GLP-1 <span class="text-neon-blue">智能匹配器</span></h1>
                    <p class="text-xs text-gray-400">基于临床试验数据的个性化减肥方案推荐</p>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- 免责声明 -->
        <div class="bg-yellow-900/20 border border-yellow-600/30 rounded-lg p-4 mb-8">
            <p class="text-yellow-400 text-sm text-center">
                ⚠️ 免责声明：本工具基于公开临床试验数据，仅供参考，不构成医疗建议。用药前请咨询专业医生。
            </p>
        </div>

        <!-- 用户输入区 -->
        <section class="bg-dark-800 border border-dark-500 rounded-2xl p-6 mb-8">
            <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                <span class="text-neon-blue">📋</span> 您的基本信息
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">当前体重 (kg)</label>
                    <input type="number" id="weight" class="w-full bg-dark-700 border border-dark-500 rounded-lg px-4 py-3 text-white focus:border-neon-blue input-glow transition" placeholder="例如: 100">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">身高 (cm)</label>
                    <input type="number" id="height" class="w-full bg-dark-700 border border-dark-500 rounded-lg px-4 py-3 text-white focus:border-neon-blue input-glow transition" placeholder="例如: 170">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">年龄</label>
                    <input type="number" id="age" class="w-full bg-dark-700 border border-dark-500 rounded-lg px-4 py-3 text-white focus:border-neon-blue input-glow transition" placeholder="例如: 35">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">性别</label>
                    <select id="gender" class="w-full bg-dark-700 border border-dark-500 rounded-lg px-4 py-3 text-white focus:border-neon-blue input-glow transition">
                        <option value="">请选择</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">腰围 (cm)</label>
                    <input type="number" id="waist" class="w-full bg-dark-700 border border-dark-500 rounded-lg px-4 py-3 text-white focus:border-neon-blue input-glow transition" placeholder="例如: 95">
                    <p class="text-xs text-gray-500 mt-1">中心性肥胖：男≥90cm，女≥85cm</p>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">预算范围（月）</label>
                    <select id="budget" class="w-full bg-dark-700 border border-dark-500 rounded-lg px-4 py-3 text-white focus:border-neon-blue input-glow transition">
                        <option value="">不限</option>
                        <option value="500">500元以下</option>
                        <option value="1000">500-1000元</option>
                        <option value="2000">1000-2000元</option>
                        <option value="unlimited">2000元以上</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">期望疗程</label>
                    <select id="duration" class="w-full bg-dark-700 border border-dark-500 rounded-lg px-4 py-3 text-white focus:border-neon-blue input-glow transition">
                        <option value="12">3个月（12周）</option>
                        <option value="24">6个月（24周）</option>
                        <option value="48" selected>12个月（48周）</option>
                        <option value="52">1年（52周）</option>
                    </select>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm text-gray-400 mb-3">健康状况（多选）</label>
                <div class="flex flex-wrap gap-3">
                    <label class="flex items-center gap-2 bg-dark-700 px-4 py-2 rounded-lg cursor-pointer hover:bg-dark-600 transition">
                        <input type="checkbox" name="condition" value="diabetes" class="w-4 h-4 rounded border-gray-500 text-neon-blue focus:ring-neon-blue">
                        <span class="text-sm">2型糖尿病</span>
                    </label>
                    <label class="flex items-center gap-2 bg-dark-700 px-4 py-2 rounded-lg cursor-pointer hover:bg-dark-600 transition">
                        <input type="checkbox" name="condition" value="nash" class="w-4 h-4 rounded border-gray-500 text-neon-blue focus:ring-neon-blue">
                        <span class="text-sm">脂肪肝/NASH</span>
                    </label>
                    <label class="flex items-center gap-2 bg-dark-700 px-4 py-2 rounded-lg cursor-pointer hover:bg-dark-600 transition">
                        <input type="checkbox" name="condition" value="hypertension" class="w-4 h-4 rounded border-gray-500 text-neon-blue focus:ring-neon-blue">
                        <span class="text-sm">高血压</span>
                    </label>
                    <label class="flex items-center gap-2 bg-dark-700 px-4 py-2 rounded-lg cursor-pointer hover:bg-dark-600 transition">
                        <input type="checkbox" name="condition" value="dyslipidemia" class="w-4 h-4 rounded border-gray-500 text-neon-blue focus:ring-neon-blue">
                        <span class="text-sm">血脂异常</span>
                    </label>
                    <label class="flex items-center gap-2 bg-dark-700 px-4 py-2 rounded-lg cursor-pointer hover:bg-dark-600 transition">
                        <input type="checkbox" name="condition" value="osa" class="w-4 h-4 rounded border-gray-500 text-neon-blue focus:ring-neon-blue">
                        <span class="text-sm">睡眠呼吸暂停</span>
                    </label>
                    <label class="flex items-center gap-2 bg-dark-700 px-4 py-2 rounded-lg cursor-pointer hover:bg-dark-600 transition">
                        <input type="checkbox" name="condition" value="cvd" class="w-4 h-4 rounded border-gray-500 text-neon-blue focus:ring-neon-blue">
                        <span class="text-sm">心血管疾病</span>
                    </label>
                </div>
            </div>

            <button onclick="calculateMatch()" class="w-full bg-gradient-to-r from-neon-blue to-neon-purple text-dark-900 font-bold py-4 rounded-xl hover:shadow-lg hover:shadow-neon-blue/30 transition transform hover:scale-[1.02]">
                🔍 开始匹配最佳方案
            </button>
        </section>

        <!-- 结果显示区（默认隐藏） -->
        <div id="results" class="hidden">
            <!-- BMI 分析 -->
            <section class="bg-dark-800 border border-dark-500 rounded-2xl p-6 mb-8">
                <h2 class="text-lg font-bold mb-4">您的身体指标分析</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="text-center">
                        <div class="text-4xl font-bold text-neon-blue mb-2" id="bmiValue">--</div>
                        <div class="text-sm text-gray-400">BMI指数</div>
                        <div class="mt-2 px-3 py-1 rounded-full text-sm font-medium inline-block" id="bmiCategory">
                            --
                        </div>
                    </div>
                    <div class="text-center">
                        <div class="text-4xl font-bold text-neon-green mb-2" id="targetWeight">--</div>
                        <div class="text-sm text-gray-400">建议目标体重</div>
                        <div class="text-xs text-gray-500 mt-1">减重10-15%</div>
                    </div>
                    <div class="text-center">
                        <div class="text-4xl font-bold text-neon-orange mb-2" id="waistStatus">--</div>
                        <div class="text-sm text-gray-400">腰围状态</div>
                        <div class="text-xs text-gray-500 mt-1">中心性肥胖风险评估</div>
                    </div>
                </div>
            </section>

            <!-- 推荐方案对比 -->
            <section class="mb-8">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                    <span class="text-neon-orange">🏆</span> 为您推荐的方案
                </h2>
                
                <div id="recommendations" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- 减肥曲线对比 -->
            <section class="bg-dark-800 border border-dark-500 rounded-2xl p-6 mb-8">
                <h2 class="text-lg font-bold mb-4">预期减肥曲线对比</h2>
                <div class="h-80">
                    <canvas id="weightLossChart"></canvas>
                </div>
            </section>

            <!-- 费用对比 -->
            <section class="bg-dark-800 border border-dark-500 rounded-2xl p-6 mb-8">
                <h2 class="text-lg font-bold mb-4">治疗费用预估</h2>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-dark-500">
                                <th class="text-left py-3 px-4 text-gray-400 font-medium">方案</th>
                                <th class="text-center py-3 px-4 text-gray-400 font-medium">月费用</th>
                                <th class="text-center py-3 px-4 text-gray-400 font-medium">总费用</th>
                                <th class="text-center py-3 px-4 text-gray-400 font-medium">医保后</th>
                                <th class="text-center py-3 px-4 text-gray-400 font-medium">等待仿制药</th>
                            </tr>
                        </thead>
                        <tbody id="costTable">
                            <!-- 动态生成 -->
                        </tbody>
                    </table>
                </div>
                <p class="text-xs text-gray-500 mt-4">
                    * 费用估算基于当前市场价格，实际价格以医院和药店为准。司美格鲁肽仿制药预计2026年Q4上市，价格可能降至原研的30-50%。
                </p>
            </section>
        </div>
    </main>

    <script src="js/predictor.js"></script>
</body>
</html>

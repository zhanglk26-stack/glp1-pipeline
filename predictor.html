     <main class="max-w-6xl mx-auto px-4 py-8"> <!-- 免责声明 --> <div class="bg-yellow-900/20 border border-yellow-600/30 rounded-lg p-4 mb-8"> <p class="text-yellow-400 text-sm text-center">  免责声明：本工具基于公开临床试验数据，仅供参考，不构成医疗建议。用药前请咨询专业医生。 </p> </div> <!-- 用户输入区 --> <section class="bg-white border border-gray-200 rounded-2xl p-6 mb-8"> <h2 class="text-lg font-bold mb-6 flex items-center gap-2"> <span class="text-blue-600"></span> 您的基本信息 </h2> <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6"> <div> <label class="block text-sm text-gray-900 mb-2">当前体重 (kg)</label> <input type="number" id="weight" class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 text-gray-900 focus:border-neon-blue input-glow transition" placeholder="例如: 100"> </div> <div> <label class="block text-sm text-gray-900 mb-2">身高 (cm)</label> <input type="number" id="height" class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 text-gray-900 focus:border-neon-blue input-glow transition" placeholder="例如: 170"> </div> <div> <label class="block text-sm text-gray-900 mb-2">年龄</label> <input type="number" id="age" class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 text-gray-900 focus:border-neon-blue input-glow transition" placeholder="例如: 35"> </div> <div> <label class="block text-sm text-gray-900 mb-2">性别</label> <select id="gender" class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 text-gray-900 focus:border-neon-blue input-glow transition"> <option value="">请选择</option> <option value="male">男</option> <option value="female">女</option> </select> </div> </div> <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6"> <div> <label class="block text-sm text-gray-900 mb-2">腰围 (cm)</label> <input type="number" id="waist" class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 text-gray-900 focus:border-neon-blue input-glow transition" placeholder="例如: 95"> <p class="text-xs text-gray-900 mt-1">中心性肥胖：男≥90cm，女≥85cm</p> </div> <div> <label class="block text-sm text-gray-900 mb-2">预算范围（月）</label> <select id="budget" class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 text-gray-900 focus:border-neon-blue input-glow transition"> <option value="">不限</option> <option value="500">500元以下</option> <option value="1000">500-1000元</option> <option value="2000">1000-2000元</option> <option value="unlimited">2000元以上</option> </select> </div> <div> <label class="block text-sm text-gray-900 mb-2">期望疗程</label> <select id="duration" class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 text-gray-900 focus:border-neon-blue input-glow transition"> <option value="12">3个月（12周）</option> <option value="24">6个月（24周）</option> <option value="48" selected>12个月（48周）</option> <option value="52">1年（52周）</option> </select> </div> </div> <div class="mb-6"> <label class="block text-sm text-gray-900 mb-3">健康状况（多选）</label> <div class="flex flex-wrap gap-3"> <label class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg cursor-pointer hover:bg-white transition"> <input type="checkbox" name="condition" value="diabetes" class="w-4 h-4 rounded border-gray-500 text-blue-600 focus:ring-neon-blue"> <span class="text-sm">2型糖尿病</span> </label> <label class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg cursor-pointer hover:bg-white transition"> <input type="checkbox" name="condition" value="nash" class="w-4 h-4 rounded border-gray-500 text-blue-600 focus:ring-neon-blue"> <span class="text-sm">脂肪肝/NASH</span> </label> <label class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg cursor-pointer hover:bg-white transition"> <input type="checkbox" name="condition" value="hypertension" class="w-4 h-4 rounded border-gray-500 text-blue-600 focus:ring-neon-blue"> <span class="text-sm">高血压</span> </label> <label class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg cursor-pointer hover:bg-white transition"> <input type="checkbox" name="condition" value="dyslipidemia" class="w-4 h-4 rounded border-gray-500 text-blue-600 focus:ring-neon-blue"> <span class="text-sm">血脂异常</span> </label> <label class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg cursor-pointer hover:bg-white transition"> <input type="checkbox" name="condition" value="osa" class="w-4 h-4 rounded border-gray-500 text-blue-600 focus:ring-neon-blue"> <span class="text-sm">睡眠呼吸暂停</span> </label> <label class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg cursor-pointer hover:bg-white transition"> <input type="checkbox" name="condition" value="cvd" class="w-4 h-4 rounded border-gray-500 text-blue-600 focus:ring-neon-blue"> <span class="text-sm">心血管疾病</span> </label> </div> </div> <button onclick="calculateMatch()" class="w-full text-white font-bold py-4 rounded-xl hover: hover:-500/30 transition transform hover:scale-[1.02]"> 🔍 开始匹配最佳方案 </button> </section> <!-- 结果显示区（默认隐藏） --> <div id="results" class="hidden"> <!-- BMI 分析 --> <section class="bg-white border border-gray-200 rounded-2xl p-6 mb-8"> <h2 class="text-lg font-bold mb-4">您的身体指标分析</h2> <div class="grid grid-cols-1 md:grid-cols-3 gap-6"> <div class="text-center"> <div class="text-4xl font-bold text-blue-600 mb-2" id="bmiValue">--</div> <div class="text-sm text-gray-900">BMI指数</div> <div class="mt-2 px-3 py-1 rounded-full text-sm font-medium inline-block" id="bmiCategory"> -- </div> </div> <div class="text-center"> <div class="text-4xl font-bold text-gray-900 mb-2" id="targetWeight">--</div> <div class="text-sm text-gray-900">建议目标体重</div> <div class="text-xs text-gray-900 mt-1">减重10-15%</div> </div> <div class="text-center"> <div class="text-4xl font-bold text-orange-500 mb-2" id="waistStatus">--</div> <div class="text-sm text-gray-900">腰围状态</div> <div class="text-xs text-gray-900 mt-1">中心性肥胖风险评估</div> </div> </div> </section> <!-- 推荐方案对比 --> <section class="mb-8"> <h2 class="text-2xl font-bold mb-6 flex items-center gap-2"> <span class="text-orange-500"></span> 为您推荐的方案 </h2> <div id="recommendations" class="grid grid-cols-1 lg:grid-cols-3 gap-6"> <!-- 动态生成 --> </div> </section> <!-- 减肥曲线对比 --> <section class="bg-white border border-gray-200 rounded-2xl p-6 mb-8"> <h2 class="text-lg font-bold mb-4">预期减肥曲线对比</h2> <div class="h-80"> <canvas id="weightLossChart"></canvas> </div> </section> <!-- 费用对比 --> <section class="bg-white border border-gray-200 rounded-2xl p-6 mb-8"> <h2 class="text-lg font-bold mb-4">治疗费用预估</h2> <div class="overflow-x-auto"> <table class="w-full"> <thead> <tr class="border-b border-gray-200"> <th class="text-left py-3 px-4 text-gray-900 font-medium">方案</th> <th class="text-center py-3 px-4 text-gray-900 font-medium">月费用</th> <th class="text-center py-3 px-4 text-gray-900 font-medium">总费用</th> <th class="text-center py-3 px-4 text-gray-900 font-medium">医保后</th> <th class="text-center py-3 px-4 text-gray-900 font-medium">等待仿制药</th> </tr> </thead> <tbody id="costTable"> <!-- 动态生成 --> </tbody> </table> </div> <p class="text-xs text-gray-900 mt-4"> * 费用估算基于当前市场价格，实际价格以医院和药店为准。司美格鲁肽仿制药预计2026年Q4上市，价格可能降至原研的30-50%。 </p> </section> </div> </main> <script src="js/predictor.js"></script>

<!DOCTYPE html>
<html lang="zh-CN">
<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>GLP-1 管线全景图谱 | GLP-1 Pipeline Tracker</title> <script src="js/lib/tailwindcss.js"></script> <script src="js/lib/chart.js"></script> <link rel="stylesheet" href="css/style.css"> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet"> </head>
<body class="bg-white text-gray-900 font-sans min-h-screen"> <!-- 导航栏 --> 
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <span class="font-bold text-lg text-gray-900 leading-none">GLP-1 <span class="text-blue-600">Pipeline</span></span>
                    <span class="hidden lg:block text-xs text-gray-400 border-l border-gray-200 pl-4 py-1">
                        数据来源于网络检索，不保证准确性，不构成医疗/投资建议
                    </span>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-900 hover:text-blue-600 font-bold transition-colors">概览与数据库</a>
                    <a href="predictor.html" class="text-gray-900 hover:text-blue-600 font-bold transition-colors">智能匹配</a>
                    <a href="about.html" class="text-gray-900 hover:text-blue-600 font-bold transition-colors">关于</a>
                </div>
        
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <!-- 统计卡片 --> 
        <section id="overview" class="mb-6">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                <!-- Data Card 1 -->
                <div class="card p-5">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">总管线产品</span>
                    </div>
                    <div class="flex items-end gap-2">
                        <span id="totalProducts" class="text-3xl font-bold text-gray-900 italic">0</span>
                        <span class="text-xs text-gray-400 mb-1">款产品</span>
                    </div>
                </div>
                <!-- Data Card 2 -->
                <div class="card p-5">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">已上市</span>
                    </div>
                    <div class="flex items-end gap-2">
                        <span id="approvedCount" class="text-3xl font-bold text-blue-600 italic">0</span>
                        <span class="text-xs text-gray-400 mb-1">款产品</span>
                    </div>
                </div>
                <!-- Data Card 3 -->
                <div class="card p-5">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">中国公司管线</span>
                    </div>
                    <div class="flex items-end gap-2">
                        <span id="chinaCount" class="text-3xl font-bold text-gray-900 italic">0</span>
                        <span class="text-xs text-gray-400 mb-1">项在研</span>
                    </div>
                </div>
                <!-- Data Card 4 -->
                <div class="card p-5">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">多靶点产品</span>
                    </div>
                    <div class="flex items-end gap-2">
                        <span id="multiTargetCount" class="text-3xl font-bold text-gray-900 italic">0</span>
                        <span class="text-xs text-gray-400 mb-1">款产品</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 筛选与控制区 -->
        <section id="filters" class="mb-4">
            <div class="bg-gray-50 p-4 border border-gray-100 rounded-xl">
                <div class="flex flex-col gap-4">
                    <!-- 顶行：搜索 + 核心筛选 -->
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="relative flex-1 min-w-[300px]">
                            <input type="text" id="searchInput" placeholder="搜索产品、公司或靶点..." 
                                class="w-full pl-3 pr-4 py-2 bg-white border border-gray-200 rounded text-sm focus:ring-1 focus:ring-blue-500 outline-none">
                        </div>
                        
                        <div class="flex flex-wrap items-center gap-4 text-xs">
                    <div class="flex items-center gap-2">
                                <span class="font-bold text-xs text-gray-400">阶段:</span>
                                <div class="flex gap-x-3 gap-y-1">
                                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="stage-cb" value="已上市">已上市</label>
                                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="stage-cb" value="NDA">NDA</label>
                                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="stage-cb" value="III期">III期</label>
                                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="stage-cb" value="II期">II期</label>
                                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="stage-cb" value="I期">I期</label>
                                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="stage-cb" value="临床前">临床前</label>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs text-gray-400">途径:</span>
                                <div class="flex gap-2">
                                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="route-cb" value="口服">口服</label>
                                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="route-cb" value="注射">注射</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-x-6 gap-y-2 text-xs border-t border-gray-100 pt-3">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-400">适应症:</span>
                            <div class="flex flex-wrap gap-2">
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="ind-cb" value="减重">减重</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="ind-cb" value="T2DM">T2DM</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="ind-cb" value="NASH">NASH</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="ind-cb" value="慢性肾病">CKD</label>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-400">热门靶点:</span>
                            <div class="flex flex-wrap gap-2">
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="target-cb" value="GLP-1">GLP</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="target-cb" value="GIP">GIP</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="target-cb" value="GCG">GCG</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="target-cb" value="Amylin">Amylin</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="target-cb" value="FGF21">FGF21</label>
                            </div>
                        </div>
                        <div class="ml-auto">
                            <button id="clearFilters" class="text-blue-600 hover:underline">重置所有</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 表格区 -->
        <section class="bg-white rounded-xl border border-gray-200">
            <div class="">
                <table class="data-table w-full text-left border-collapse table-fixed lg:table-auto">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200">
                            <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider" data-sort="name_cn">产品名称 <span class="sort-icon ml-1 text-[10px]">↕</span></th>
                            <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider" data-sort="company">研发企业 <span class="sort-icon ml-1 text-[10px]">↕</span></th>
                            <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider" data-sort="stage">最高阶段 <span class="sort-icon ml-1 text-[10px]">↕</span></th>
                            <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">给药途径</th>
                            <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">周期</th>
                            <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider" data-sort="approval_date">预计上市/获批 <span class="sort-icon ml-1 text-[10px]">↕</span></th>
                            <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">核心适应症</th>
                            <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">最新进展数据</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-gray-100">
                        <!-- JS 填充 -->
                    </tbody>
                </table>
            </div>
        </section>
        
    </main>

    <!-- 新闻莫态框 -->
    <div id="newsModal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 id="newsModalTitle" class="font-bold text-gray-900">相关进展新闻</h3>
                <button id="closeNewsModal" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="newsModalContent" class="p-6 max-h-[70vh] overflow-y-auto space-y-4">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

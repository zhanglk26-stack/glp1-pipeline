<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靶点-阶段矩阵图谱 | GLP-1 Pipeline Tracker</title>
    <meta name="description" content="GLP-1药物靶点与研发阶段可视化矩阵，直观展示竞争格局与创新趋势">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        .viz-container { min-height: 600px; }
        .axis-label { font-size: 12px; fill: #64748b; font-weight: 500; }
        .stage-label { font-size: 13px; fill: #1e293b; font-weight: 600; }
        .target-label { font-size: 12px; fill: #1e293b; font-weight: 600; }
        .bubble { cursor: pointer; transition: all 0.3s; }
        .bubble:hover { stroke: #3b82f6; stroke-width: 3; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
        .tooltip {
            position: absolute; padding: 12px; background: white; border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); pointer-events: none;
            font-size: 13px; max-width: 280px; z-index: 100; border: 1px solid #e2e8f0;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .grid-line { stroke: #e2e8f0; stroke-width: 1; }
        .stage-separator { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 4; }
        .filter-btn.active { background: #3b82f6; color: white; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <span class="font-bold text-xl tracking-tight text-slate-900">GLP-1 <span class="text-blue-600">Pipeline</span></span>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-slate-600 hover:text-blue-600 font-semibold transition-colors">概览与数据库</a>
                    <a href="visualization.html" class="text-slate-900 hover:text-blue-600 font-semibold transition-colors">靶点矩阵</a>
                    <a href="predictor.html" class="text-slate-600 hover:text-blue-600 font-semibold transition-colors">智能匹配</a>
                    <a href="about.html" class="text-slate-600 hover:text-blue-600 font-semibold transition-colors">关于</a>
                </div>
                <div class="md:hidden">
                    <button id="mobileMenuBtn" class="p-2 text-slate-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 移动端菜单 -->
    <div id="mobileMenu" class="hidden md:hidden bg-white border-b border-slate-200 px-4 py-3 space-y-1">
        <a href="index.html" class="block px-3 py-2 rounded-lg text-slate-600 font-semibold hover:bg-slate-50">概览与数据库</a>
        <a href="visualization.html" class="block px-3 py-2 rounded-lg text-slate-900 font-semibold bg-slate-50">靶点矩阵</a>
        <a href="predictor.html" class="block px-3 py-2 rounded-lg text-slate-600 font-semibold hover:bg-slate-50">智能匹配</a>
        <a href="about.html" class="block px-3 py-2 rounded-lg text-slate-600 font-semibold hover:bg-slate-50">关于</a>
    </div>

    <!-- 主要内容 -->
    <main class="max-w-[1400px] mx-auto px-4 py-6">
        <!-- 标题区 -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-900 mb-2">GLP-1 靶点-阶段矩阵图谱</h1>
            <p class="text-slate-500 text-sm">X轴：靶点创新梯度 | Y轴：管线阶段 | 气泡大小：市场热度 | 颜色：公司类型</p>
        </div>

        <!-- 筛选器 -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <span class="text-xs font-bold text-slate-400 uppercase">公司类型：</span>
                <button class="filter-btn active px-3 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition" data-filter="all">全部</button>
                <button class="filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition" data-filter="international">国际大厂</button>
                <button class="filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition" data-filter="domestic_innovator">国产创新</button>
                <button class="filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition" data-filter="biosimilar">仿制药</button>
            </div>
        </div>

        <!-- 可视化区域 -->
        <div class="bg-white rounded-xl border border-slate-200 p-6">
            <div id="viz-container" class="viz-container w-full overflow-x-auto"></div>
        </div>

        <!-- 统计信息 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
            <div class="card p-4 text-center">
                <div class="text-2xl font-bold text-blue-600" id="totalCount">0</div>
                <div class="text-xs text-slate-500">显示产品数</div>
            </div>
            <div class="card p-4 text-center">
                <div class="text-2xl font-bold text-green-600" id="marketCount">0</div>
                <div class="text-xs text-slate-500">已上市/NDA</div>
            </div>
            <div class="card p-4 text-center">
                <div class="text-2xl font-bold text-purple-600" id="multiCount">0</div>
                <div class="text-xs text-slate-500">多靶点产品</div>
            </div>
            <div class="card p-4 text-center">
                <div class="text-2xl font-bold text-orange-600" id="companyCount">0</div>
                <div class="text-xs text-slate-500">参与公司</div>
            </div>
        </div>
    </main>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip hidden"></div>

    <!-- 详情模态框 -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modalTitle" class="font-bold text-slate-900 text-lg">产品详情</h3>
                <button id="closeModal" class="text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-200 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="modalContent" class="p-6"></div>
        </div>
    </div>

    <script>
        // 配置
        const config = {
            margin: { top: 60, right: 40, bottom: 120, left: 100 },
            bubbleMinRadius: 4,
            bubbleMaxRadius: 12,
            colors: {
                international: '#3b82f6',  // 蓝色
                domestic_innovator: '#ef4444',  // 红色
                biosimilar: '#9ca3af',  // 灰色
                oral: { stroke: '#f59e0b', strokeDasharray: '4,2' }  // 口服剂型边框
            }
        };

        let allData = [];
        let currentFilter = 'all';

        // 靶点组合排序（X轴）- key必须按字母顺序排序（与数据一致）
        const targetOrder = [
            { key: 'GLP-1R', label: 'GLP-1R\n单靶点', count: 0 },
            { key: 'GIPR,GLP-1R', label: 'GLP-1R+GIPR\n双靶点', count: 0 },
            { key: 'GCGR,GLP-1R', label: 'GLP-1R+GCGR\n双靶点', count: 0 },
            { key: 'Amylin,GLP-1R', label: 'Amylin+GLP-1R\n复方', count: 0 },
            { key: 'GCGR,GIPR,GLP-1R', label: 'GIP+GCG\n三靶点', count: 0 },
            { key: 'FGF21R,GCGR,GLP-1R', label: 'FGF21组合\n特殊', count: 0 },
            { key: 'GLP-1R,Insulin', label: 'Insulin组合\n复方', count: 0 }
        ];

        // 阶段排序（Y轴，从上到下）
        const stageOrder = ['已上市', 'NDA', 'III期', 'II期', 'I期', '临床前', '已上市(依苏帕格鲁肽)'];

        // 判断公司类型
        function getCompanyType(company) {
            const international = ['礼来', '诺和诺德', '阿斯利康', '赛诺菲', '勃林格殷格翰', '强生', '默沙东', '葛兰素史克', '诺华', '安进', 'Altimmune'];
            if (international.some(c => company.includes(c))) return 'international';
            if (company.includes('诺和诺德') && company.includes('华东')) return 'biosimilar';  // 华东仿制药
            if (company.includes('华东医药') || company.includes('石药') || company.includes('丽珠') ||
                company.includes('九源') || company.includes('正大天晴') || company.includes('联邦') ||
                company.includes('通化东宝') || company.includes('齐鲁')) return 'biosimilar';
            return 'domestic_innovator';
        }

        // 获取颜色
        function getColor(companyType) {
            return config.colors[companyType] || config.colors.biosimilar;
        }

        // 加载数据
        async function loadData() {
            const response = await fetch('data/pipeline.json');
            const data = await response.json();
            allData = data.products.map(p => ({
                ...p,
                targetKey: (p.targets || []).slice().sort().join(','),
                companyType: getCompanyType(p.company),
                stageIndex: stageOrder.findIndex(s => p.stage.includes(s)) !== -1 ?
                    stageOrder.findIndex(s => p.stage.includes(s)) : 5
            }));

            // 统计各靶点组合数量
            targetOrder.forEach(t => {
                t.count = allData.filter(p => p.targetKey === t.key).length;
            });

            updateStats();
            renderChart();
        }

        // 更新统计
        function updateStats() {
            const filtered = currentFilter === 'all' ? allData : allData.filter(p => p.companyType === currentFilter);
            const marketReady = filtered.filter(p => p.stage === '已上市' || p.stage.includes('NDA')).length;
            const multiTarget = filtered.filter(p => p.targets && p.targets.length >= 2).length;
            const companies = new Set(filtered.map(p => p.company)).size;

            document.getElementById('totalCount').textContent = filtered.length;
            document.getElementById('marketCount').textContent = marketReady;
            document.getElementById('multiCount').textContent = multiTarget;
            document.getElementById('companyCount').textContent = companies;
        }

        // 渲染图表
        function renderChart() {
            const container = document.getElementById('viz-container');
            container.innerHTML = '';

            const width = Math.max(900, container.clientWidth) - config.margin.left - config.margin.right;
            const height = 500;

            const svg = d3.select('#viz-container')
                .append('svg')
                .attr('width', width + config.margin.left + config.margin.right)
                .attr('height', height + config.margin.top + config.margin.bottom);

            const g = svg.append('g')
                .attr('transform', `translate(${config.margin.left},${config.margin.top})`);

            // 过滤数据
            const filteredData = currentFilter === 'all' ? allData : allData.filter(p => p.companyType === currentFilter);

            // 设置比例尺
            const xScale = d3.scaleBand()
                .domain(targetOrder.map(d => d.key))
                .range([0, width])
                .padding(0.1);

            const yScale = d3.scaleBand()
                .domain(stageOrder)
                .range([0, height])
                .padding(0.1);

            // 气泡大小比例尺
            const sizeScale = d3.scaleSqrt()
                .domain([0, d3.max(filteredData, d => d.news?.length || 1)])
                .range([config.bubbleMinRadius, config.bubbleMaxRadius]);

            // 绘制网格线
            g.selectAll('.grid-x')
                .data(targetOrder)
                .enter()
                .append('line')
                .attr('class', 'grid-line')
                .attr('x1', d => xScale(d.key) + xScale.bandwidth() / 2)
                .attr('x2', d => xScale(d.key) + xScale.bandwidth() / 2)
                .attr('y1', 0)
                .attr('y2', height);

            g.selectAll('.grid-y')
                .data(stageOrder)
                .enter()
                .append('line')
                .attr('class', 'grid-line')
                .attr('x1', 0)
                .attr('x2', width)
                .attr('y1', d => yScale(d) + yScale.bandwidth() / 2)
                .attr('y2', d => yScale(d) + yScale.bandwidth() / 2);

            // X轴标签
            g.selectAll('.x-label')
                .data(targetOrder)
                .enter()
                .append('text')
                .attr('class', 'target-label')
                .attr('x', d => xScale(d.key) + xScale.bandwidth() / 2)
                .attr('y', height + 25)
                .attr('text-anchor', 'middle')
                .selectAll('tspan')
                .data(d => d.label.split('\n'))
                .enter()
                .append('tspan')
                .attr('x', function() { return d3.select(this.parentNode).attr('x'); })
                .attr('dy', (d, i) => i === 0 ? 0 : 14)
                .text(d => d);

            // 添加产品数量
            g.selectAll('.x-count')
                .data(targetOrder)
                .enter()
                .append('text')
                .attr('class', 'axis-label')
                .attr('x', d => xScale(d.key) + xScale.bandwidth() / 2)
                .attr('y', height + 60)
                .attr('text-anchor', 'middle')
                .text(d => `${d.count}款`);

            // Y轴标签
            g.selectAll('.y-label')
                .data(stageOrder.filter(s => ['已上市', 'NDA', 'III期', '其他'].some(k => s.includes(k))))
                .enter()
                .append('text')
                .attr('class', 'stage-label')
                .attr('x', -10)
                .attr('y', d => yScale(d) + yScale.bandwidth() / 2 + 4)
                .attr('text-anchor', 'end')
                .text(d => d.includes('已上市') ? '已上市' : d.includes('依苏帕') ? '已上市' : d);

            // 阶段分隔线（已上市/NDA与其他阶段之间）
            const ndaIndex = stageOrder.findIndex(s => s === 'NDA');
            if (ndaIndex !== -1) {
                g.append('line')
                    .attr('class', 'stage-separator')
                    .attr('x1', 0)
                    .attr('x2', width)
                    .attr('y1', yScale(stageOrder[ndaIndex]) + yScale.bandwidth())
                    .attr('y2', yScale(stageOrder[ndaIndex]) + yScale.bandwidth());
            }

            // 添加阶段标签
            g.append('text')
                .attr('class', 'axis-label')
                .attr('x', width + 10)
                .attr('y', yScale('已上市') / 2)
                .attr('font-weight', 'bold')
                .attr('fill', '#166534')
                .text('已获批');

            g.append('text')
                .attr('class', 'axis-label')
                .attr('x', width + 10)
                .attr('y', (yScale('III期') + yScale('已上市')) / 2 + 20)
                .attr('font-weight', 'bold')
                .attr('fill', '#92400e')
                .text('即将上市');

            g.append('text')
                .attr('class', 'axis-label')
                .attr('x', width + 10)
                .attr('y', (yScale('临床前') + yScale('III期')) / 2 + 40)
                .attr('font-weight', 'bold')
                .attr('fill', '#64748b')
                .text('早期阶段');

            // 按靶点+阶段分组，计算每个格子内的位置
            const cellGroups = {};
            filteredData.forEach(d => {
                const key = `${d.targetKey}|${d.stageIndex}`;
                if (!cellGroups[key]) cellGroups[key] = [];
                cellGroups[key].push(d);
            });

            // 为每个气泡计算在格子内的偏移位置
            filteredData.forEach(d => {
                const key = `${d.targetKey}|${d.stageIndex}`;
                const group = cellGroups[key];
                const index = group.indexOf(d);
                const count = group.length;

                // 在格子内使用蜂窝状布局
                const maxCols = Math.ceil(Math.sqrt(count));
                const col = index % maxCols;
                const row = Math.floor(index / maxCols);
                const cellW = xScale.bandwidth() * 0.7;
                const cellH = yScale.bandwidth() * 0.7;

                d.cellOffsetX = (col - (maxCols - 1) / 2) * (cellW / Math.max(1, maxCols - 1 || 1)) * 0.8;
                d.cellOffsetY = (row - (Math.ceil(count / maxCols) - 1) / 2) * (cellH / Math.max(1, Math.ceil(count / maxCols) - 1 || 1)) * 0.8;

                // 如果只有一个气泡，居中
                if (count === 1) {
                    d.cellOffsetX = 0;
                    d.cellOffsetY = 0;
                }
            });

            // 绘制气泡
            const bubbles = g.selectAll('.bubble')
                .data(filteredData)
                .enter()
                .append('circle')
                .attr('class', 'bubble')
                .attr('cx', d => xScale(d.targetKey) + xScale.bandwidth() / 2 + d.cellOffsetX)
                .attr('cy', d => yScale(stageOrder[d.stageIndex]) + yScale.bandwidth() / 2 + d.cellOffsetY)
                .attr('r', 0)
                .attr('fill', d => getColor(d.companyType))
                .attr('fill-opacity', 0.85)
                .attr('stroke', d => d.administration?.includes('口服') ? config.colors.oral.stroke : 'white')
                .attr('stroke-width', d => d.administration?.includes('口服') ? 2 : 1.5)
                .attr('stroke-dasharray', d => d.administration?.includes('口服') ? config.colors.oral.strokeDasharray : null);

            // 动画
            bubbles.transition()
                .duration(800)
                .delay((d, i) => i * 30)
                .attr('r', d => sizeScale(d.news?.length || 1));

            // 交互事件
            const tooltip = d3.select('#tooltip');

            bubbles.on('mouseenter', function(event, d) {
                tooltip.classed('hidden', false)
                    .html(`
                        <div class="font-bold text-slate-900 mb-1">${d.name_cn}</div>
                        <div class="text-slate-600 text-xs mb-2">${d.company}</div>
                        <div class="flex gap-2 mb-2">
                            <span class="px-2 py-0.5 bg-slate-100 rounded text-xs">${d.stage}</span>
                            <span class="px-2 py-0.5 bg-blue-50 text-blue-600 rounded text-xs">${d.targets?.join('+')}</span>
                        </div>
                        <div class="text-xs text-slate-500">${d.latest_update?.substring(0, 60)}...</div>
                    `)
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 10) + 'px');
            })
            .on('mousemove', function(event) {
                tooltip.style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 10) + 'px');
            })
            .on('mouseleave', function() {
                tooltip.classed('hidden', true);
            })
            .on('click', function(event, d) {
                showDetailModal(d);
            });
        }

        // 显示详情模态框
        function showDetailModal(product) {
            document.getElementById('modalTitle').textContent = product.name_cn;
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-500">研发企业</span>
                        <span class="font-semibold text-slate-900">${product.company}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-500">研发阶段</span>
                        <span class="stage-pill ${getStageClass(product.stage)}">${product.stage}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-500">作用靶点</span>
                        <span class="font-semibold text-slate-900">${product.targets?.join(' + ')}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-500">给药途径</span>
                        <span class="font-semibold text-slate-900">${product.administration || '-'}</span>
                    </div>
                    <div class="border-t pt-4">
                        <div class="text-sm text-slate-500 mb-2">最新进展</div>
                        <p class="text-sm text-slate-700">${product.latest_update}</p>
                    </div>
                    ${product.news?.length ? `
                    <div class="border-t pt-4">
                        <div class="text-sm text-slate-500 mb-2">相关新闻</div>
                        <div class="space-y-2">
                            ${product.news.slice(0, 3).map(n => `
                                <a href="${n.url}" target="_blank" class="block text-sm text-blue-600 hover:underline">${n.title}</a>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function getStageClass(stage) {
            if (stage === '已上市') return 'stage-approved';
            if (stage.includes('NDA')) return 'stage-nda';
            if (stage.includes('III')) return 'stage-phase3';
            if (stage.includes('II')) return 'stage-phase2';
            if (stage.includes('I')) return 'stage-phase1';
            return 'stage-preclinical';
        }

        // 筛选按钮事件
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'bg-blue-600', 'text-white'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                updateStats();
                renderChart();
            });
        });

        // 关闭模态框
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('detailModal').classList.add('hidden');
        });
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) document.getElementById('detailModal').classList.add('hidden');
        });

        // 移动端菜单
        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        });

        // 初始化
        loadData();

        // 窗口大小改变时重新渲染
        window.addEventListener('resize', () => {
            renderChart();
        });
